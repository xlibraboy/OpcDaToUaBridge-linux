name: Windows release (server)

# Builds the bridge's Windows installers and — on a v* tag — publishes the server's
# GitHub Release:
#   OpcBridge-<version>-win-x86.msi   the bridge, 32-bit (the station default)
#   OpcBridge-<version>-win-x64.msi   the bridge, 64-bit (a host whose OPC DA servers
#                                     are 64-bit only; the two share one UpgradeCode,
#                                     so installing one over the other replaces it)
#
# The server product is the bridge plus the shared libraries (Core, Client): it versions
# with ServerVersion in Directory.Build.props, releases on v* tags and carries the root
# CHANGELOG.md, which is the server's release authority. The two desktop apps have their
# own workflows (hmi-release.yml, designer-release.yml), versions and tags — the three
# products install, upgrade and uninstall independently.
#
# The installers are built here, on Windows, because WiX cannot link an MSI on Linux (it
# reports WIX0000 and fails to validate Directory/@Name). One package source covers both
# architectures (packaging/msi/OpcBridge.wxs): a 32-bit process is required to activate
# 32-bit local OPC DA COM servers, and a host whose DA servers are 64-bit only cannot
# activate them from a 32-bit bridge, so x86 is the default and x64 is the 64-bit-only
# case. -arch sets both the package (Program Files vs Program Files (x86)) and, through
# the package's own $(sys.BUILDARCH), the server payload and the Apps & features name
# that go in it. The two packages share one UpgradeCode, so a station moves between them
# by installing the other one.
#
# A v* tag push publishes a GitHub Release carrying the two installers; a manual
# workflow_dispatch run stops at the uploaded artifact, because there is no tag to
# release against.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version from Directory.Build.props
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path Directory.Build.props -Pattern '<ServerVersion>([^<]+)</ServerVersion>'
          if (-not $match) { throw 'no <ServerVersion> in Directory.Build.props' }
          $version = $match.Matches[0].Groups[1].Value
          # A tag names the release; it must agree with the version the packages are
          # stamped from, or the Release page would carry a label the assets do not.
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag '$env:GITHUB_REF_NAME' does not match server version $version (expected v$version)"
          }
          Write-Host "version=$version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish (server win-x86 + win-x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/OpcBridge.App/OpcBridge.App.csproj -c Release -r win-x86 --self-contained true -o build/publish-x86
          dotnet publish src/OpcBridge.App/OpcBridge.App.csproj -c Release -r win-x64 --self-contained true -o build/publish-x64

      - name: Harvest publish dirs into WiX fragments
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The exe is skipped here and declared in the package source, which is where the
          # service attaches to it. Harvested once per architecture; the package built for
          # an architecture links the matching fragment.
          python scripts/msi/harvest.py build/publish-x86 build/wix/AppFiles-x86.wxs INSTALLFOLDER AppFiles OpcBridge.App.exe
          python scripts/msi/harvest.py build/publish-x64 build/wix/AppFiles-x64.wxs INSTALLFOLDER AppFiles OpcBridge.App.exe

      - name: Install WiX 5.0.2 and its extensions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
          # Extensions must match the tool version. Unpinned resolves to 7.x, which
          # WiX 5 rejects with WIX6101 (and 6+ additionally requires an OSMF licence).
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.Firewall.wixext/5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Build installers (server win-x86 + win-x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # One package source, one build per architecture; see the header comment for
          # why both exist and how they replace each other.
          foreach ($arch in @('x86', 'x64')) {
            wix build -arch $arch `
              -ext WixToolset.Util.wixext `
              -ext WixToolset.Firewall.wixext `
              -ext WixToolset.UI.wixext `
              -define "MsiVersion=$version" `
              -d HttpPort=8080 `
              -d UaPort=4840 `
              packaging/msi/OpcBridge.wxs `
              "build/wix/AppFiles-$arch.wxs" `
              -o "dist/OpcBridge-$version-win-$arch.msi"
            if ($LASTEXITCODE -ne 0) { throw "wix build failed for win-$arch" }
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: OpcBridge-${{ steps.version.outputs.version }}-msi
          path: dist/*.msi
          if-no-files-found: error

      # Only a tagged run has something to release; a workflow_dispatch run stops above.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'

          # The notes are the newest released section of the server's changelog, which is
          # the release authority and must carry it. -Encoding utf8 is required: without it
          # Get-Content reads UTF-8 as ANSI and mangles every em dash in the file.
          $lines = Get-Content -Path CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no '## [$version]' section" }
          # LineNumber is 1-based, so $lines[$start] is the line after the heading and the
          # body ends on the line before the next released heading.
          $next = ($lines | Select-String -Pattern '^## \[' | Where-Object { $_.LineNumber -gt $start } | Select-Object -First 1).LineNumber
          $end = if ($next) { $next - 1 } else { $lines.Count }
          $body = if ($end -gt $start) { @($lines[$start..($end - 1)]) } else { @() }
          $body | Set-Content -Path build/release-notes.md -Encoding utf8

          # The assets are named from Directory.Build.props, not the tag, so they always
          # match what the steps above produced: the bridge's x86/x64 pair.
          gh release create $env:TAG `
            "dist/OpcBridge-$version-win-x86.msi" `
            "dist/OpcBridge-$version-win-x64.msi" `
            --title "OpcBridge $version" `
            --notes-file build/release-notes.md
