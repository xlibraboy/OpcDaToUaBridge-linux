name: Windows release

# Builds every Windows release artifact in one run: the .msi installer and the two
# portable server zips.
#
# The installer is built here, on Windows, because WiX cannot link an MSI on Linux (it
# reports WIX0000 and fails to validate Directory/@Name). The Linux/Docker path
# (scripts/msi/build-portable.sh) builds the same zips for local iteration.
#
# The installer is a feature tree: server, HMI runtime and HMI designer are
# individually selectable at install time.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  msi:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version from Directory.Build.props
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path Directory.Build.props -Pattern '<Version>([^<]+)</Version>'
          if (-not $match) { throw 'no <Version> in Directory.Build.props' }
          $version = $match.Matches[0].Groups[1].Value
          Write-Host "version=$version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish (server win-x86 + win-x64, HMI + Designer win-x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/OpcBridge.App/OpcBridge.App.csproj -c Release -r win-x86 --self-contained true -o build/publish-x86
          dotnet publish src/OpcBridge.App/OpcBridge.App.csproj -c Release -r win-x64 --self-contained true -o build/publish-x64
          dotnet publish src/OpcBridge.Hmi/OpcBridge.Hmi.csproj -c Release -r win-x64 --self-contained true -o build/publish-hmi
          dotnet publish src/OpcBridge.Hmi.Designer/OpcBridge.Hmi.Designer.csproj -c Release -r win-x64 --self-contained true -o build/publish-designer

      - name: Harvest publish dirs into WiX fragments
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Each app's exe is skipped here and declared in OpcBridge.wxs, which is where
          # the service (server) and the Start Menu shortcuts (HMI/Designer) attach to it.
          python scripts/msi/harvest.py build/publish-x86 build/wix/AppFiles-x86.wxs INSTALLFOLDER AppFiles OpcBridge.App.exe
          python scripts/msi/harvest.py build/publish-hmi build/wix/HmiFiles.wxs HmiFolder HmiFiles OpcBridge.Hmi.exe
          python scripts/msi/harvest.py build/publish-designer build/wix/DesignerFiles.wxs DesignerFolder DesignerFiles OpcBridge.Hmi.Designer.exe

      - name: Install WiX 5.0.2 and its extensions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
          # Extensions must match the tool version. Unpinned resolves to 7.x, which
          # WiX 5 rejects with WIX6101 (and 6+ additionally requires an OSMF licence).
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.Firewall.wixext/5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          wix build -arch x86 `
            -ext WixToolset.Util.wixext `
            -ext WixToolset.Firewall.wixext `
            -ext WixToolset.UI.wixext `
            -define "MsiVersion=${{ steps.version.outputs.version }}" `
            -d HttpPort=8080 `
            -d UaPort=4840 `
            packaging/msi/OpcBridge.wxs `
            build/wix/AppFiles-x86.wxs `
            build/wix/HmiFiles.wxs `
            build/wix/DesignerFiles.wxs `
            -o "dist/OpcBridge-${{ steps.version.outputs.version }}-win-x86.msi"

      - name: Build portable zips
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/msi/make-zip.py build/publish-x86 "dist/OpcBridge-${{ steps.version.outputs.version }}-win-x86.zip"
          python scripts/msi/make-zip.py build/publish-x64 "dist/OpcBridge-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpcBridge-${{ steps.version.outputs.version }}-win
          path: |
            dist/*.msi
            dist/*.zip
          if-no-files-found: error
