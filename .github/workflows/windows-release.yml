name: Windows release

# Builds the Windows release artifacts: four .msi installers, one per app —
#   OpcBridge-<version>-win-x86.msi           the bridge (server), 32-bit
#   OpcBridge-<version>-win-x64.msi           the bridge (server), 64-bit
#   OpcBridge-HMI-<version>-win-x64.msi       the HMI runtime
#   OpcBridge-Designer-<version>-win-x64.msi  the HMI designer
#
# The installers are built here, on Windows, because WiX cannot link an MSI on Linux (it
# reports WIX0000 and fails to validate Directory/@Name).
#
# One package source per app (packaging/msi/OpcBridge.wxs for the bridge, OpcBridge.Hmi.wxs
# and OpcBridge.Designer.wxs beside it), and each is its own product with its own
# UpgradeCode: the three install, upgrade and uninstall independently, and the Release is
# what builds them together. The bridge package is built once per architecture, because a
# 32-bit process is required to activate 32-bit local OPC DA COM servers and a host whose
# DA servers are 64-bit only cannot activate them from a 32-bit bridge: x86 is the default
# and x64 is the 64-bit-only case. Those two share one UpgradeCode, so installing one over
# the other — even at the same version — replaces it instead of colliding on the Windows
# service and data directory both own; a station switches architecture by installing the
# other package (see packaging/msi/OpcBridge.wxs). The HMI runtime and designer are
# self-contained win-x64 apps that only speak HTTP to the bridge, so each has one package.
#
# A `v*` tag push also publishes a GitHub Release carrying the four installers; a manual
# workflow_dispatch run stops at the uploaded artifact, because there is no tag to
# release against.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version from Directory.Build.props
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path Directory.Build.props -Pattern '<Version>([^<]+)</Version>'
          if (-not $match) { throw 'no <Version> in Directory.Build.props' }
          $version = $match.Matches[0].Groups[1].Value
          Write-Host "version=$version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish (server win-x86 + win-x64, HMI + Designer win-x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/OpcBridge.App/OpcBridge.App.csproj -c Release -r win-x86 --self-contained true -o build/publish-x86
          dotnet publish src/OpcBridge.App/OpcBridge.App.csproj -c Release -r win-x64 --self-contained true -o build/publish-x64
          dotnet publish src/OpcBridge.Hmi/OpcBridge.Hmi.csproj -c Release -r win-x64 --self-contained true -o build/publish-hmi
          dotnet publish src/OpcBridge.Hmi.Designer/OpcBridge.Hmi.Designer.csproj -c Release -r win-x64 --self-contained true -o build/publish-designer

      - name: Harvest publish dirs into WiX fragments
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Each app's exe is skipped here and declared in that app's package source, which
          # is where the service (server) and the Start Menu shortcuts (all three) attach to
          # it. The server is harvested once per architecture; the package built for an
          # architecture links the matching one below, so the two AppFiles fragments — which
          # declare the same element ids, hashed from the same relative paths — never meet in
          # one package.
          python scripts/msi/harvest.py build/publish-x86 build/wix/AppFiles-x86.wxs INSTALLFOLDER AppFiles OpcBridge.App.exe
          python scripts/msi/harvest.py build/publish-x64 build/wix/AppFiles-x64.wxs INSTALLFOLDER AppFiles OpcBridge.App.exe
          python scripts/msi/harvest.py build/publish-hmi build/wix/HmiFiles.wxs HmiFolder HmiFiles OpcBridge.Hmi.exe
          python scripts/msi/harvest.py build/publish-designer build/wix/DesignerFiles.wxs DesignerFolder DesignerFiles OpcBridge.Hmi.Designer.exe

      - name: Install WiX 5.0.2 and its extensions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
          # Extensions must match the tool version. Unpinned resolves to 7.x, which
          # WiX 5 rejects with WIX6101 (and 6+ additionally requires an OSMF licence).
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.Firewall.wixext/5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Build installers (bridge win-x86 + win-x64, HMI, Designer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Bridge: one package source, one build per architecture. -arch sets the package
          # itself (Program Files vs Program Files (x86)) and, through the package's own
          # $(sys.BUILDARCH), the server payload and the Apps & features name that go in it.
          # Both share the package's UpgradeCode, so a station moves between them by
          # installing the other one.
          foreach ($arch in @('x86', 'x64')) {
            wix build -arch $arch `
              -ext WixToolset.Util.wixext `
              -ext WixToolset.Firewall.wixext `
              -ext WixToolset.UI.wixext `
              -define "MsiVersion=$version" `
              -d HttpPort=8080 `
              -d UaPort=4840 `
              packaging/msi/OpcBridge.wxs `
              "build/wix/AppFiles-$arch.wxs" `
              -o "dist/OpcBridge-$version-win-$arch.msi"
            if ($LASTEXITCODE -ne 0) { throw "wix build failed for win-$arch" }
          }
          # HMI runtime and designer: win-x64-only single-app products, each its own package
          # source, UpgradeCode and harvest fragment. The UI extension is the only one they
          # need — no firewall rules or InternetShortcut in either.
          wix build -arch x64 `
            -ext WixToolset.UI.wixext `
            -define "MsiVersion=$version" `
            packaging/msi/OpcBridge.Hmi.wxs `
            build/wix/HmiFiles.wxs `
            -o "dist/OpcBridge-HMI-$version-win-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw 'wix build failed for the HMI installer' }
          wix build -arch x64 `
            -ext WixToolset.UI.wixext `
            -define "MsiVersion=$version" `
            packaging/msi/OpcBridge.Designer.wxs `
            build/wix/DesignerFiles.wxs `
            -o "dist/OpcBridge-Designer-$version-win-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw 'wix build failed for the designer installer' }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: OpcBridge-${{ steps.version.outputs.version }}-msi
          path: dist/*.msi
          if-no-files-found: error

      # Only a tagged run has something to release; a workflow_dispatch run stops above.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'

          # Release notes are composed from the three per-app changelogs: each file's
          # '## [<version>]' section under its own heading. A file without that section
          # means the release shipped the app unchanged; the server's CHANGELOG.md is the
          # release authority and must always carry it.
          # -Encoding utf8 is required: without it Get-Content reads UTF-8 as ANSI and
          # mangles every em dash in the file.
          $changelogs = @(
            @{ Label = 'OpcBridge Server'; Path = 'CHANGELOG.md' },
            @{ Label = 'OpcBridge HMI Runtime'; Path = 'src/OpcBridge.Hmi/CHANGELOG.md' },
            @{ Label = 'OpcBridge HMI Designer'; Path = 'src/OpcBridge.Hmi.Designer/CHANGELOG.md' }
          )

          $notes = @()
          foreach ($changelog in $changelogs) {
            $notes += "## $($changelog.Label)"
            $notes += ''
            $lines = Get-Content -Path $changelog.Path -Encoding utf8
            $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
            if (-not $start) {
              if ($changelog.Path -eq 'CHANGELOG.md') { throw "CHANGELOG.md has no '## [$version]' section" }
              $notes += '_No changes in this release._'
              $notes += ''
              continue
            }
            $rest = @($lines[$start..($lines.Count - 1)])
            $next = ($rest | Select-String -Pattern '^## \[' | Select-Object -Skip 1 -First 1).LineNumber
            $body = if ($next) { @($rest[0..($next - 2)]) } else { $rest }
            $notes += $body
            $notes += ''
          }
          $notes | Set-Content -Path build/release-notes.md -Encoding utf8

          # The assets are named from Directory.Build.props, not the tag, so they always
          # match what the steps above produced: one installer per app — the bridge's
          # x86/x64 pair (win-x86 where its DA servers are 32-bit, win-x64 where they are
          # 64-bit only), the HMI runtime and the designer.
          gh release create $env:TAG `
            "dist/OpcBridge-$version-win-x86.msi" `
            "dist/OpcBridge-$version-win-x64.msi" `
            "dist/OpcBridge-HMI-$version-win-x64.msi" `
            "dist/OpcBridge-Designer-$version-win-x64.msi" `
            --title "OpcBridge $version" `
            --notes-file build/release-notes.md
